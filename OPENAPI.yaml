# Document Metadata
# Doc ID: openapi.v0
# Version: 1.0.0
# Status: authoritative
# Kind: api-contract
# Last Updated: 2026-04-02
# Authority: This is the current source of truth for the v0.1 HTTP contract.
# Supersedes: none

openapi: 3.1.0
info:
  title: Agentic Search API
  version: 1.0.0
  description: |
    HTTP contract for the Agentic Search v0.1 backend.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /query-plans/preview:
    post:
      summary: Preview a structured plan for a raw query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewRequest"
      responses:
        "200":
          description: Query plan preview
  /threads:
    get:
      summary: List threads
      responses:
        "200":
          description: Thread list
    post:
      summary: Create a thread, plan, and run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateThreadRequest"
      responses:
        "200":
          description: Thread and run created
  /threads/{threadId}:
    get:
      summary: Get thread details and latest run summary
      parameters:
        - in: path
          name: threadId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thread details
  /threads/{threadId}/config:
    patch:
      summary: Update thread query/config
      parameters:
        - in: path
          name: threadId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateThreadConfigRequest"
      responses:
        "200":
          description: Updated thread
  /threads/{threadId}/runs:
    post:
      summary: Create a new run from an existing thread config
      parameters:
        - in: path
          name: threadId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run created
  /runs/{runId}:
    get:
      summary: Get run status, progress, and observability metrics
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run details
  /runs/{runId}/events:
    get:
      summary: Get legacy run activity events
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Legacy run events
  /runs/{runId}/debug:
    get:
      summary: Get debug summary, checkpoints, and provider ledger
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Debug summary
  /runs/{runId}/debug/trace:
    get:
      summary: Get paginated execution trace events
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: page_size
          schema:
            type: integer
      responses:
        "200":
          description: Paginated trace events
  /runs/{runId}/results:
    get:
      summary: Get result rows and partial cell states
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: include_rejected
          schema:
            type: boolean
      responses:
        "200":
          description: Run results
  /runs/{runId}/results/{rowId}:
    get:
      summary: Get row detail with cells, evidence, and sources
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
        - in: path
          name: rowId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Row details
  /runs/{runId}/cancel:
    post:
      summary: Cancel an active run
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run canceled
  /runs/{runId}/export:
    get:
      summary: Export accepted rows
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
        - in: query
          name: format
          required: true
          schema:
            type: string
            enum: [csv, json]
      responses:
        "200":
          description: Export content
components:
  schemas:
    PreviewRequest:
      type: object
      required: [query, target_results]
      properties:
        query:
          type: string
        target_results:
          type: integer
    CreateThreadRequest:
      type: object
      required: [query, target_results, criteria, columns]
      properties:
        query:
          type: string
        target_results:
          type: integer
        criteria:
          type: array
          items:
            type: object
        columns:
          type: array
          items:
            type: object
    UpdateThreadConfigRequest:
      type: object
      properties:
        query:
          type: string
        target_results:
          type: integer
        criteria:
          type: array
          items:
            type: object
        columns:
          type: array
          items:
            type: object
